model_name: google/gemma-4-e4b-it
load_in_4bit: false        # E4B is small enough for 16-bit LoRA
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj

learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 50
num_epochs: 2
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
max_seq_length: 4096
output_dir: /outputs/gemma-e4b
