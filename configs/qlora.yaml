model_name: poolside/Laguna-XS-2.1
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_steps: 100
num_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
max_seq_length: 8192
output_dir: /outputs/laguna-codealchemy-adapter

wandb_project: laguna-codealchemy
